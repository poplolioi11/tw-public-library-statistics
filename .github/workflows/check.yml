name: Check public data package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      # Official stable releases checked on 2026-10-25:
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      # https://github.com/actions/setup-python/releases/tag/v7.1.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run script unit tests without source downloads
        run: python -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Run regression fixtures without source downloads
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test publication validator fixtures
        run: python scripts/validate_publication.py --self-test
      - name: Validate canonical formats and packaged evidence
        run: python scripts/validate_publication.py
      - name: Test supplemental validator fixtures
        run: python scripts/validate_phase1_supplements.py --self-test
      - name: Validate source/availability index
        run: python scripts/validate_phase1_inventory.py
      - name: Validate supplemental source-cell formats and partitions
        run: python scripts/validate_phase1_supplements.py
      - name: Validate full definition layer and reader projections
        run: python scripts/validate_phase2.py
      - name: Replay fixed source cases and CLI operation guards
        run: python scripts/check_phase2_cases.py
      - name: Validate full source-selection formats and original statuses
        run: python scripts/validate_phase3.py
      - name: Replay fixed source-selection cases and refusal guards
        run: python scripts/check_phase3_cases.py --final
      - name: Check every SVG point, source, edge and compiled interval
        run: python scripts/check_chart_readers.py

      - name: Check all lazy website charts, source links and initial byte budget
        run: python scripts/validate_lightweight_site.py
